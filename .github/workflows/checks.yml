name: Checks

on:
  push:
    branches: [main, master, feat/**]
  pull_request:

jobs:
  route-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Every API handler authorizes (ADR-0011)
        run: node scripts/check-route-auth.mjs

  leads-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-root-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pintegration-root-pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Leads authenticated HTTP integration (issue #369)
        env:
          INTEGRATION_DB_HOST: 127.0.0.1
          INTEGRATION_DB_PORT: 3306
          INTEGRATION_DB_NAME: accent_integration_369
          INTEGRATION_DB_USER: root
          INTEGRATION_DB_PASSWORD: integration-root-pass
          LEADS_INTEGRATION_PORT: 31369
        run: npm run test:integration:leads
