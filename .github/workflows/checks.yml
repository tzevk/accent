name: Checks

on:
  push:
    branches: [main, master]
  pull_request:

# PR updates replace obsolete checks; pushes still verify the integration branches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Native path filter: documentation-only pull requests skip runtime
    # checks, everything else (source, config, pushes, unknown diffs) runs them.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No dependency install: the scope helper is dependency-free.
      - name: Detect whether the change needs runtime checks
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo 'runtime=true' >> "$GITHUB_OUTPUT"
            echo '[ci-scope] Integration-branch pushes run every runtime check.'
            exit 0
          fi

          if [[ ! "$CI_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'runtime=true' >> "$GITHUB_OUTPUT"
            echo '[ci-scope] Base revision unavailable; running every runtime check.'
            exit 0
          fi

          # Use the base revision so a classifier change cannot exempt itself.
          scope_dir="$(mktemp -d "$RUNNER_TEMP/accent-ci-scope.XXXXXX")"
          trap 'rm -rf -- "$scope_dir"' EXIT
          if git show "$CI_BASE_SHA:scripts/testing/ci-scope.ts" > "$scope_dir/ci-scope.ts" 2>/dev/null &&
             git show "$CI_BASE_SHA:scripts/testing/change-scope.ts" > "$scope_dir/change-scope.ts" 2>/dev/null; then
            node --experimental-strip-types "$scope_dir/ci-scope.ts"
          else
            echo 'runtime=true' >> "$GITHUB_OUTPUT"
            echo '[ci-scope] Base classifier unavailable; running every runtime check.'
          fi

  lint:
    needs: changes
    if: success() && needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint

  unit-tests:
    needs: changes
    if: success() && needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vitest unit tests with JUnit report
        run: npm run test:unit -- --reporter=default --reporter=junit --outputFile.junit=artifacts/unit-tests/junit.xml
      - name: Upload Vitest JUnit report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-junit
          path: artifacts/unit-tests/junit.xml
          retention-days: 1
          if-no-files-found: ignore

  build:
    # success() requires the scope job and both cheap checks to pass.
    needs: [changes, lint, unit-tests]
    if: success() && needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Next.js production build
        run: npm run build:prod

  e2e:
    # Both suites share one install and one MariaDB 10.11 service, but each
    # harness creates and drops its own disposable database and owns the Next
    # process it starts. Leads seeds migration history; the browser harness
    # migrates cleanly from scratch.
    needs: [changes, lint, unit-tests]
    if: success() && needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    # The retired Leads and Playwright jobs allowed 30 minutes each.
    timeout-minutes: 60
    services:
      # Production runs MariaDB 10.11, so both integration runs use the same
      # engine. MySQL accepts and rejects different SQL.
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: integration-root-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pintegration-root-pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 'Leads authenticated HTTP integration (issue #368)'
        id: leads
        # Keep the job green so browser setup and the Playwright suite still
        # run after a Leads failure. The final step restores the failure, so
        # neither suite can mask the other.
        continue-on-error: true
        env:
          INTEGRATION_DB_HOST: 127.0.0.1
          INTEGRATION_DB_PORT: 3306
          INTEGRATION_DB_NAME: accent_integration_369
          INTEGRATION_DB_USER: root
          INTEGRATION_DB_PASSWORD: integration-root-pass
          LEADS_INTEGRATION_PORT: 31369
        run: npm run test:integration
      - name: Install Chromium with system dependencies
        # success() is true here when checkout, install, and Leads did not abort
        # the job; a tolerated Leads failure still lets the browser suite run.
        if: success()
        run: npx playwright install --with-deps chromium
      - name: 'Full Playwright suite (issue #426)'
        id: playwright
        # Runs only after the shared setup and Chromium install succeeded, even
        # when Leads failed, so browser results stay independent of Leads.
        if: success()
        env:
          INTEGRATION_DB_HOST: 127.0.0.1
          INTEGRATION_DB_PORT: 3306
          INTEGRATION_DB_NAME: accent_integration_e2e_426
          INTEGRATION_DB_USER: root
          INTEGRATION_DB_PASSWORD: integration-root-pass
          E2E_ISSUE: '426'
        run: npm run test:e2e
      - name: Upload Playwright traces retained by passing retries
        # `retain-on-failure` keeps the trace.zip from a failed first attempt
        # even when the retry passes, so upload only those ZIPs on green runs.
        # The HTML report, screenshots, and videos stay in the failure upload.
        if: steps.playwright.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-retained-traces
          path: e2e/artifacts/**/test-results/**/trace.zip
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload Playwright failure artifacts
        if: failure() && steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: e2e/artifacts
          retention-days: 7
          if-no-files-found: ignore
      - name: Fail when the Leads integration failed
        if: always() && steps.leads.outcome == 'failure'
        run: |
          echo '::error::Leads authenticated HTTP integration failed.'
          exit 1

  verify:
    # Stable aggregate job id for repository required-check settings.
    # Enforcement must be configured separately by a repository administrator.
    # It succeeds only when the scope decision is a known "true"/"false" and
    # every job that scope requires succeeded; a documentation-only change may
    # only skip the runtime jobs.
    if: always()
    needs: [changes, lint, unit-tests, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Passed through env so job ids and results never reach the shell
      # through direct ${{ }} interpolation.
      NEEDS_JSON: ${{ toJSON(needs) }}
      EXPECTED_JOBS: |
        changes
        lint
        unit-tests
        build
        e2e
    steps:
      - name: Aggregate required check results
        run: |
          node - <<'NODE'
          const expected = (process.env.EXPECTED_JOBS || '').split(/\s+/).filter(Boolean);
          const raw = process.env.NEEDS_JSON;
          const problems = [];
          let results = null;
          let runtime;

          if (expected.length === 0) {
            problems.push('EXPECTED_JOBS is empty; the aggregate would pass vacuously');
          }

          if (!raw) {
            problems.push('NEEDS_JSON is missing; no dependency results to verify');
          } else {
            let parsed;
            try {
              parsed = JSON.parse(raw);
            } catch (error) {
              problems.push(`NEEDS_JSON is not valid JSON (${error.message})`);
            }

            if (parsed !== undefined) {
              if (parsed === null || typeof parsed !== 'object' || Array.isArray(parsed)) {
                problems.push('NEEDS_JSON must be a JSON object keyed by job id');
              } else if (Object.keys(parsed).length === 0) {
                problems.push('NEEDS_JSON is empty; refusing to pass vacuously');
              } else {
                results = parsed;
                for (const id of Object.keys(parsed)) {
                  if (!expected.includes(id)) {
                    problems.push(`unexpected dependency "${id}" is not tracked by EXPECTED_JOBS`);
                  }
                }
              }
            }
          }

          // An unusable payload already failed above; per-job noise would not help.
          if (results) {
            runtime = results.changes?.outputs?.runtime;
            if (results.changes?.result === 'success' && runtime !== 'true' && runtime !== 'false') {
              const seen = runtime === undefined ? 'missing' : JSON.stringify(runtime);
              problems.push(`changes runtime output is ${seen}; expected "true" or "false"`);
            }

            for (const id of expected) {
              const result = results[id]?.result;
              if (typeof result !== 'string' || result.length === 0) {
                problems.push(`"${id}" has no reported result`);
              } else if (result === 'success') {
                continue;
              } else if (id !== 'changes' && runtime === 'false' && result === 'skipped') {
                // Documentation-only pull requests legitimately skip runtime jobs.
                continue;
              } else {
                problems.push(`"${id}" finished as "${result}"`);
              }
            }
          }

          if (problems.length > 0) {
            for (const problem of problems) console.log(`::error::${problem}`);
            console.log(`verify: ${problems.length} required check problem(s).`);
            process.exitCode = 1;
          } else if (runtime === 'false') {
            console.log('verify: documentation-only change; runtime checks skipped as scoped.');
          } else {
            console.log(`verify: all ${expected.length} required checks succeeded.`);
          }
          NODE
