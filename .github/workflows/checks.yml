name: Checks

on:
  push:
    branches: [main, master, feat/**]
  pull_request:

jobs:
  route-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Every API handler authorizes (ADR-0011)
        run: node scripts/check-route-auth.mjs
